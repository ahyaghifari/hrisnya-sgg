options:
  max-time: 30
  size: 2x

pipelines:
  branches:
    staging:
      - step:
          name: 🚀 Deploy to Staging
          deployment: staging
          script:
            - pipe: atlassian/ssh-run:0.4.0
              variables:
                SSH_USER: ${SSH_USERNAME}
                SERVER: ${SSH_HOST}
                PASSWORD: ${SSH_PASSWORD}
                PORT: '22'
                MODE: 'command'
                COMMAND: |
                  echo "===== START DEPLOY (STAGING) ====="
                  bash ${DEPLOY_PATH} staging
                  echo "===== DEPLOY STAGING SUCCESS ====="

